<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pipewright Logo</title>
    <link rel="icon" type="image/svg+xml" href="pipewright-icon-k8s.svg">
    <style>
        body {
            margin: 0;
            background: #EEF1F6;
            color: #0F172A;
            font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
            padding: 28px 16px
        }

        main {
            max-width: 1000px;
            margin: auto;
            display: grid;
            gap: 36px
        }

        h1 {
            font-size: 26px;
            margin: 0
        }

        h2 {
            font-size: 18px;
            margin: 0
        }

        p {
            margin: 0;
            color: #55607A
        }

        section {
            display: grid;
            gap: 14px;
            border-top: 1px solid #CDD4E0;
            padding-top: 20px
        }

        .r {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-start
        }

        .end {
            align-items: flex-end
        }

        .s {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr))
        }

        figure {
            margin: 0;
            display: grid;
            gap: 6px;
            min-width: 0
        }

        figcaption {
            font: 12px Consolas, monospace;
            color: #55607A;
            overflow-wrap: anywhere
        }

        .g {
            padding: 18px;
            border: 1px solid #CDD4E0;
            display: flex;
            justify-content: center;
            align-items: center
        }

        .g img {
            display: block;
            max-width: 100%
        }

        .wide .g img {
            width: 100% !important
        }
    </style>
</head>

<body>
    <main>
        <h1>Pipewright logo</h1>
        <section>
            <h2>Icon and logo</h2>
            <div class="r">
                <figure class="">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-icon.svg" alt="Original"
                            style="width:150px"></div>
                    <figcaption>Original<br>pipewright-icon.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-icon-k8s.svg" alt="K8s"
                            style="width:150px"></div>
                    <figcaption>K8s<br>pipewright-icon-k8s.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#0B1020"><img src="pipewright-icon-k8s.svg" alt="K8s on dark"
                            style="width:150px"></div>
                    <figcaption>K8s on dark<br>pipewright-icon-k8s.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#0B1020"><img src="pipewright-icon-k8s-dark.svg" alt="Dark variant"
                            style="width:150px"></div>
                    <figcaption>Dark variant<br>pipewright-icon-k8s-dark.svg</figcaption>
                </figure>
            </div>
            <div class="s">
                <figure class="wide">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-logo.svg" alt="Original logo"
                            style="width:440px"></div>
                    <figcaption>Original logo<br>pipewright-logo.svg</figcaption>
                </figure>
                <figure class="wide">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-logo-k8s.svg"
                            alt="K8s logo, wordmark unchanged" style="width:440px"></div>
                    <figcaption>K8s logo, wordmark unchanged<br>pipewright-logo-k8s.svg</figcaption>
                </figure>
            </div>
        </section>
        <section>
            <h2>Variants</h2>
            <div class="s">
                <figure class="wide">
                    <div class="g" style="background:#0B1020"><img src="pipewright-logo-k8s-dark.svg"
                            alt="Dark background" style="width:440px"></div>
                    <figcaption>Dark background<br>pipewright-logo-k8s-dark.svg</figcaption>
                </figure>
                <figure class="wide">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-logo-k8s-mono.svg" alt="Mono"
                            style="width:440px"></div>
                    <figcaption>Mono<br>pipewright-logo-k8s-mono.svg</figcaption>
                </figure>
                <figure class="wide">
                    <div class="g" style="background:#0B1020"><img src="pipewright-logo-k8s-mono-reversed.svg"
                            alt="Mono reversed" style="width:440px"></div>
                    <figcaption>Mono reversed<br>pipewright-logo-k8s-mono-reversed.svg</figcaption>
                </figure>
                <figure class="wide">
                    <div class="g" style="background:#22D3EE"><img src="pipewright-logo-k8s-mono.svg"
                            alt="Mono on a color" style="width:440px"></div>
                    <figcaption>Mono on a color<br>pipewright-logo-k8s-mono.svg</figcaption>
                </figure>
            </div>
            <div class="r">
                <figure class="">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-icon-k8s-mono.svg" alt="Mono icon"
                            style="width:96px"></div>
                    <figcaption>Mono icon<br>pipewright-icon-k8s-mono.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#0B1020"><img src="pipewright-icon-k8s-mono-reversed.svg"
                            alt="Mono reversed icon" style="width:96px"></div>
                    <figcaption>Mono reversed icon<br>pipewright-icon-k8s-mono-reversed.svg</figcaption>
                </figure>
            </div>
        </section>
        <section>
            <h2>Small sizes</h2>
            <p>The SVG scales to any size. Use the simplified small drawing at 16 px, and the full drawing from 32 px
                up.</p>
            <div class="r end">
                <figure class="">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-icon-k8s-small.svg" alt="16 px"
                            style="width:16px"></div>
                    <figcaption>16 px<br>pipewright-icon-k8s-small.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#0B1020"><img src="pipewright-icon-k8s-small.svg" alt="16 px"
                            style="width:16px"></div>
                    <figcaption>16 px<br>pipewright-icon-k8s-small.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-icon-k8s.svg" alt="32 px"
                            style="width:32px"></div>
                    <figcaption>32 px<br>pipewright-icon-k8s.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#0B1020"><img src="pipewright-icon-k8s.svg" alt="32 px"
                            style="width:32px"></div>
                    <figcaption>32 px<br>pipewright-icon-k8s.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-icon-k8s.svg" alt="64 px"
                            style="width:64px"></div>
                    <figcaption>64 px<br>pipewright-icon-k8s.svg</figcaption>
                </figure>
                <figure class="">
                    <div class="g" style="background:#FFFFFF"><img src="pipewright-icon-k8s.svg" alt="180 px"
                            style="width:180px"></div>
                    <figcaption>180 px<br>pipewright-icon-k8s.svg</figcaption>
                </figure>
            </div>
        </section>
    </main>
</body>

</html>
