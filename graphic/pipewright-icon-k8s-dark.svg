<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Pipewright">
  <!-- Sliced helm: octagon rim, four spokes, six handles and a diamond hub, using only 0, 45 and 90 degree edges.
       One cut splits the whole mark: the upper half ends on x+y=62, the lower half on x+y=66. -->
  <rect width="64" height="64" rx="14" fill="#1E40AF"/>
  <clipPath id="pwk8s-icon-dark-upper"><path d="M0 0H62L0 62Z"/></clipPath>
  <clipPath id="pwk8s-icon-dark-lower"><path d="M66 0V66H0Z"/></clipPath>
  <g clip-path="url(#pwk8s-icon-dark-upper)" fill="#F8FAFC">
    <path d="M25 14H39L50 25V39L39 50H25L14 39V25Z" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linejoin="miter"/>
    <rect x="29.5" y="14" width="5" height="18" transform="rotate(0 32 32)"/>
    <rect x="29.5" y="14" width="5" height="18" transform="rotate(90 32 32)"/>
    <rect x="29.5" y="14" width="5" height="18" transform="rotate(180 32 32)"/>
    <rect x="29.5" y="14" width="5" height="18" transform="rotate(270 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(0 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(90 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(135 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(180 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(270 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(315 32 32)"/>
    <path d="M32 21 43 32 32 43 21 32Z"/>
  </g>
  <g clip-path="url(#pwk8s-icon-dark-lower)" fill="#22D3EE">
    <path d="M25 14H39L50 25V39L39 50H25L14 39V25Z" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linejoin="miter"/>
    <rect x="29.5" y="14" width="5" height="18" transform="rotate(0 32 32)"/>
    <rect x="29.5" y="14" width="5" height="18" transform="rotate(90 32 32)"/>
    <rect x="29.5" y="14" width="5" height="18" transform="rotate(180 32 32)"/>
    <rect x="29.5" y="14" width="5" height="18" transform="rotate(270 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(0 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(90 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(135 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(180 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(270 32 32)"/>
    <rect x="28.5" y="3" width="7" height="13" transform="rotate(315 32 32)"/>
    <path d="M32 21 43 32 32 43 21 32Z"/>
  </g>
</svg>
