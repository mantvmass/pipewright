<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Pipewright Kubernetes continuous delivery">
  <!-- Icon (80x80, vertically centered in 96px canvas) -->
  <g transform="translate(45 8) scale(1.25)">
    <!-- Rounded square badge, seven-spoke helm wheel, sliced P in the hub.
         Rim radius 20.5 stroke 5, spokes 3.5, handles 5. Edit the rim once, the rest follow its radius. -->
    <!-- One color: the mask cuts the wheel out of the badge, then puts the P back. -->
    <mask id="pwk8s-mono-logo-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <g fill="#000000">
        <circle cx="32" cy="32" r="20.5" fill="none" stroke="#000000" stroke-width="5"/>
        <rect x="30.25" y="11.5" width="3.5" height="10" rx="1.75" transform="rotate(0 32 32)"/>
        <rect x="29.5" y="3" width="5" height="8.5" rx="2.5" transform="rotate(0 32 32)"/>
        <rect x="30.25" y="11.5" width="3.5" height="10" rx="1.75" transform="rotate(51.43 32 32)"/>
        <rect x="29.5" y="3" width="5" height="8.5" rx="2.5" transform="rotate(51.43 32 32)"/>
        <rect x="30.25" y="11.5" width="3.5" height="10" rx="1.75" transform="rotate(102.86 32 32)"/>
        <rect x="29.5" y="3" width="5" height="8.5" rx="2.5" transform="rotate(102.86 32 32)"/>
        <rect x="30.25" y="11.5" width="3.5" height="10" rx="1.75" transform="rotate(154.29 32 32)"/>
        <rect x="29.5" y="3" width="5" height="8.5" rx="2.5" transform="rotate(154.29 32 32)"/>
        <rect x="30.25" y="11.5" width="3.5" height="10" rx="1.75" transform="rotate(205.71 32 32)"/>
        <rect x="29.5" y="3" width="5" height="8.5" rx="2.5" transform="rotate(205.71 32 32)"/>
        <rect x="30.25" y="11.5" width="3.5" height="10" rx="1.75" transform="rotate(257.14 32 32)"/>
        <rect x="29.5" y="3" width="5" height="8.5" rx="2.5" transform="rotate(257.14 32 32)"/>
        <rect x="30.25" y="11.5" width="3.5" height="10" rx="1.75" transform="rotate(308.57 32 32)"/>
        <rect x="29.5" y="3" width="5" height="8.5" rx="2.5" transform="rotate(308.57 32 32)"/>
        <circle cx="32" cy="32" r="11.5"/>
      </g>
      <path fill="#FFFFFF" d="M26.56 24.52 34.72 24.52 35.40 25.20 32.68 27.92 29.96 27.92 29.96 30.64 26.56 34.04Z"/>
      <path fill="#FFFFFF" d="M36.76 26.56 37.44 27.24 37.44 32.68 34.72 35.40 29.96 35.40 29.96 39.48 26.56 39.48 26.56 36.76 31.32 32.00 33.36 32.00 34.04 31.32 34.04 29.28Z"/>
    </mask>
    <rect width="64" height="64" rx="14" fill="#000000" mask="url(#pwk8s-mono-logo-cut)"/>
  </g>

  <!-- Wordmark: vertically centered on the icon's center line (y = 48) -->
  <text x="145" y="59" textLength="170" lengthAdjust="spacing"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="35" letter-spacing="-1.1" fill="#000000">
    <tspan font-weight="400">Pipe</tspan><tspan font-weight="750" fill="#000000">wright</tspan>
  </text>
</svg>
