<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Pipewright Kubernetes continuous delivery">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset=".6" stop-color="#0F1B4D"/>
      <stop offset="1" stop-color="#070B18"/>
    </linearGradient>
    <linearGradient id="slice" gradientUnits="userSpaceOnUse" x1="20" y1="52" x2="48" y2="30">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="215" y1="0" x2="315" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <!-- diagonal cut through the P, with a 3px gap between the two halves -->
    <clipPath id="upper"><path d="M0 0H64V24.5L0 38.5Z"/></clipPath>
    <clipPath id="lower"><path d="M0 41.5 64 27.5V64H0Z"/></clipPath>
    <clipPath id="badgeClip"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <!-- Icon (80x80, vertically centered in 96px canvas) -->
  <g transform="translate(45 8) scale(1.25)">
    <rect width="64" height="64" rx="14" fill="url(#badge)"/>

    <!-- faint parallel diagonals echoing the cut -->
    <g clip-path="url(#badgeClip)" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5" fill="none">
      <path d="M0 52 64 38"/>
      <path d="M0 60 64 46"/>
      <path d="M0 18 64 4"/>
    </g>

    <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.3" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="1.5"/>

    <!-- P monogram: chamfered corners like a bent pipe, sliced on the diagonal -->
    <g transform="translate(-2 0)">
      <path clip-path="url(#upper)" fill="#F8FAFC" fill-rule="evenodd"
            d="M20 50V14H40L48 22V32L40 40H29V50ZM29 22H37L39 24V30L37 32H29Z"/>
      <path clip-path="url(#lower)" fill="url(#slice)" fill-rule="evenodd"
            d="M20 50V14H40L48 22V32L40 40H29V50ZM29 22H37L39 24V30L37 32H29Z"/>
    </g>
  </g>

  <!-- Wordmark: vertically centered on the icon's center line (y = 48) -->
  <text x="145" y="59" textLength="170" lengthAdjust="spacing"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="35" letter-spacing="-1.1" fill="#0F172A">
    <tspan font-weight="400">Pipe</tspan><tspan font-weight="750" fill="url(#word)">wright</tspan>
  </text>
</svg>